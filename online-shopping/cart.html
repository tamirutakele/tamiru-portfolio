<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        nav {
            background: #2563eb;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .cart-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .cart-container h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 4px 10px rgba(0,0,0,0.1);
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .item-price {
            color: #2563eb;
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;

            border: none;
            border-radius: 5px;

            background: #2563eb;
            color: white;

            font-size: 18px;
            cursor: pointer;
        }

        .quantity span {
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .remove-btn {
            background: #dc2626;
            color: white;
            border: none;

            padding: 8px 15px;

            border-radius: 6px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #b91c1c;
        }

        .total {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 10px;

            text-align: right;

            font-size: 22px;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;

            background: #2563eb;
            color: white;

            padding: 12px 20px;

            text-decoration: none;
            border-radius: 7px;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            font-size: 20px;
        }

        @media (max-width: 600px) {

            nav {
                padding: 15px;
            }

            nav h2 {
                font-size: 18px;
            }

            .cart-container {
                padding: 10px;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav>

        <h2>
            🛒 Online Shop
        </h2>

        <div>

            <a href="shop.html">
                Home
            </a>

            <a href="cart.html">
                Cart 🛒
            </a>

        </div>

    </nav>


    <!-- Cart -->

    <div class="cart-container">

        <h1>
            🛒 Shopping Cart
        </h1>


        <div id="cartItems"></div>


        <div class="total">

            Total:

            <span id="totalPrice">
                0
            </span>

            ETB

        </div>


        <a
            class="back-btn"
            href="shop.html">

            ← Continue Shopping

        </a>


        <a
            class="back-btn"
            href="checkout.html">

            Proceed to Checkout →

        </a>

    </div>


    <script>


        /* =========================
           DISPLAY CART
        ========================= */

        function displayCart() {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            let cartItems =
                document.getElementById(
                    "cartItems"
                );


            let total = 0;


            cartItems.innerHTML = "";


            /* Empty Cart */

            if (cart.length === 0) {

                cartItems.innerHTML = `

                    <div class="empty">

                        🛒 Your cart is empty.

                    </div>

                `;


                document.getElementById(
                    "totalPrice"
                ).innerText = "0";


                return;
            }


            /* Display Items */

            cart.forEach(
                function(item, index) {

                    /*
                        Old cart items may not
                        have quantity.
                    */

                    if (!item.quantity) {
                        item.quantity = 1;
                    }


                    let itemTotal =
                        Number(item.price) *
                        Number(item.quantity);


                    total += itemTotal;


                    cartItems.innerHTML += `

                        <div class="cart-item">

                            <div>

                                <div class="item-name">

                                    ${item.name}

                                </div>


                                <div class="item-price">

                                    ${Number(item.price)
                                        .toLocaleString()}

                                    ETB each

                                </div>


                                <div class="quantity">

                                    <button
                                        onclick="
                                            decreaseQuantity(
                                                ${index}
                                            )
                                        ">

                                        −

                                    </button>


                                    <span>

                                        ${item.quantity}

                                    </span>


                                    <button
                                        onclick="
                                            increaseQuantity(
                                                ${index}
                                            )
                                        ">

                                        +

                                    </button>

                                </div>

                            </div>


                            <div>

                                <strong>

                                    ${itemTotal
                                        .toLocaleString()}

                                    ETB

                                </strong>

                                <br><br>


                                <button
                                    class="remove-btn"
                                    onclick="
                                        removeItem(
                                            ${index}
                                        )
                                    ">

                                    Remove

                                </button>

                            </div>

                        </div>

                    `;

                }
            );


            /*
                Save quantity changes
            */

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            /*
                Display total
            */

            document.getElementById(
                "totalPrice"
            ).innerText =
                total.toLocaleString();

        }



        /* =========================
           INCREASE QUANTITY
        ========================= */

        function increaseQuantity(index) {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            if (!cart[index]) {
                return;
            }


            if (!cart[index].quantity) {
                cart[index].quantity = 1;
            }


            cart[index].quantity++;


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            displayCart();

        }



        /* =========================
           DECREASE QUANTITY
        ========================= */

        function decreaseQuantity(index) {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            if (!cart[index]) {
                return;
            }


            if (!cart[index].quantity) {
                cart[index].quantity = 1;
            }


            if (cart[index].quantity > 1) {

                cart[index].quantity--;

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            displayCart();

        }



        /* =========================
           REMOVE ITEM
        ========================= */

        function removeItem(index) {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            cart.splice(
                index,
                1
            );


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            displayCart();

        }



        /* =========================
           START
        ========================= */

        displayCart();


    </script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Online Shopping</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* Navigation */

        nav {
            background: #2563eb;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        /* Checkout Container */

        .checkout-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .checkout-container h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Form */

        .checkout-form {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.1);
        }

        .checkout-form h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* Payment Method */

        .payment-section {
            margin-top: 25px;

            background: #f8fafc;

            padding: 20px;

            border-radius: 10px;
        }

        .payment-section h2 {
            margin-bottom: 15px;
        }

        .payment-option {
            background: white;

            border: 1px solid #ddd;

            padding: 15px;

            margin-bottom: 10px;

            border-radius: 8px;

            cursor: pointer;
        }

        .payment-option:hover {
            border-color: #2563eb;
        }

        .payment-option input {
            width: auto;

            margin: 0 10px 0 0;
        }

        .payment-name {
            font-weight: bold;
        }

        .demo-text {
            color: #777;

            font-size: 13px;

            margin-left: 25px;

            margin-top: 5px;
        }

        /* Order Summary */

        .order-summary {
            margin-top: 30px;

            background: #f8fafc;

            padding: 20px;

            border-radius: 10px;
        }

        .order-summary h2 {
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;

            justify-content: space-between;

            padding: 10px 0;

            border-bottom: 1px solid #ddd;
        }

        .order-total {
            text-align: right;

            margin-top: 20px;

            font-size: 22px;

            font-weight: bold;

            color: #2563eb;
        }

        /* Place Order */

        .place-order {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #16a34a;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .place-order:hover {
            background: #15803d;
        }

        .back-btn {
            display: inline-block;

            margin-top: 20px;

            background: #2563eb;

            color: white;

            padding: 12px 20px;

            text-decoration: none;

            border-radius: 7px;
        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav>

        <h2>
            🛒 Online Shop
        </h2>

        <div>

            <a href="shop.html">
                Home
            </a>

            <a href="cart.html">
                Cart 🛒
            </a>

        </div>

    </nav>



    <!-- Checkout -->

    <div class="checkout-container">

        <h1>
            🛍️ Checkout
        </h1>


        <div class="checkout-form">

            <h2>
                Customer Information
            </h2>


            <form onsubmit="placeOrder(event)">


                <!-- Name -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >



                <!-- Phone -->

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >



                <!-- Address -->

                <label for="address">
                    Delivery Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your delivery address"
                    required
                ></textarea>



                <!-- ========================= -->
                <!-- PAYMENT METHOD -->
                <!-- ========================= -->

                <div class="payment-section">

                    <h2>
                        💳 Payment Method
                    </h2>


                    <!-- Cash -->

                    <label class="payment-option">

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="Cash on Delivery"
                            required
                        >

                        <span class="payment-name">
                            💵 Cash on Delivery
                        </span>

                    </label>



                    <!-- Telebirr -->

                    <label class="payment-option">

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="Telebirr Demo"
                        >

                        <span class="payment-name">
                            📱 Telebirr
                        </span>

                        <div class="demo-text">
                            Demo Payment Only
                        </div>

                    </label>



                    <!-- Bank -->

                    <label class="payment-option">

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="Bank/Card Demo"
                        >

                        <span class="payment-name">
                            💳 Bank / Card
                        </span>

                        <div class="demo-text">
                            Demo Payment Only
                        </div>

                    </label>

                </div>



                <!-- ========================= -->
                <!-- ORDER SUMMARY -->
                <!-- ========================= -->

                <div class="order-summary">

                    <h2>
                        Order Summary
                    </h2>

                    <div id="orderItems"></div>


                    <div class="order-total">

                        Total:

                        <span id="orderTotal">
                            0
                        </span>

                        ETB

                    </div>

                </div>



                <!-- Place Order -->

                <button
                    type="submit"
                    class="place-order">

                    Place Order ✅

                </button>

            </form>



            <a
                class="back-btn"
                href="cart.html">

                ← Back to Cart

            </a>

        </div>

    </div>



    <script>


        // ==========================================
        // LOAD CART AND CALCULATE TOTAL
        // ==========================================

        function loadOrder() {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            let orderItems =
                document.getElementById(
                    "orderItems"
                );


            let orderTotal =
                document.getElementById(
                    "orderTotal"
                );


            orderItems.innerHTML = "";

            let total = 0;



            // Check empty cart

            if (cart.length === 0) {

                orderItems.innerHTML = `

                    <p style="color:red;">

                        Your cart is empty!

                    </p>

                `;

                orderTotal.innerText = "0";

                return;
            }



            // Display products

            cart.forEach(function(item) {


                let price =
                    Number(item.price);


                let quantity =
                    Number(item.quantity) || 1;


                let itemTotal =
                    price * quantity;


                total += itemTotal;



                orderItems.innerHTML += `

                    <div class="order-item">

                        <span>

                            ${item.name}

                            × ${quantity}

                        </span>


                        <strong>

                            ${itemTotal
                                .toLocaleString()}

                            ETB

                        </strong>

                    </div>

                `;

            });



            // Display total

            orderTotal.innerText =
                total.toLocaleString();

        }



        // ==========================================
        // PLACE ORDER
        // ==========================================

        function placeOrder(event) {

            event.preventDefault();



            // Customer Information

            let name =
                document.getElementById(
                    "name"
                ).value.trim();


            let phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            let address =
                document.getElementById(
                    "address"
                ).value.trim();



            // Payment Method

            let payment =
                document.querySelector(
                    'input[name="paymentMethod"]:checked'
                );



            // Check Customer Information

            if (
                name === "" ||
                phone === "" ||
                address === ""
            ) {

                alert(
                    "Please fill all customer information!"
                );

                return;

            }



            // Check Payment

            if (!payment) {

                alert(
                    "Please select a payment method!"
                );

                return;

            }



            let paymentMethod =
                payment.value;



            // Get Cart

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];



            // Check Cart

            if (cart.length === 0) {

                alert(
                    "Your cart is empty! Please add products first."
                );

                return;

            }



            // Calculate Total

            let total = 0;


            cart.forEach(function(item) {

                let price =
                    Number(item.price);


                let quantity =
                    Number(item.quantity) || 1;


                total +=
                    price * quantity;

            });



            // Create Order

            let order = {

                name: name,

                phone: phone,

                address: address,

                items: cart,

                total: total,

                paymentMethod:
                    paymentMethod,

                status: "Pending",

                date:
                    new Date()
                        .toLocaleString()

            };



            // Save Last Order

            localStorage.setItem(

                "lastOrder",

                JSON.stringify(order)

            );



            // Save All Orders

            let orders =
                JSON.parse(
                    localStorage.getItem(
                        "orders"
                    )
                ) || [];


            orders.push(order);


            localStorage.setItem(

                "orders",

                JSON.stringify(orders)

            );



            // Remove Cart

            localStorage.removeItem(
                "cart"
            );



            // Demo Payment Message

            alert(

                "Demo Payment Selected: " +
                paymentMethod +
                "\n\n" +
                "Order placed successfully! ✅"

            );



            // Go Success Page

            window.location.href =
                "order-success.html";

        }



        // ==========================================
        // START
        // ==========================================

        loadOrder();


    </script>


</body>

</html>

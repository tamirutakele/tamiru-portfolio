<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        nav {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .box h2 {
            margin-bottom: 20px;
        }

        /* Product Form */

        .product-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .product-form input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        /* Tables */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .product-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
            background: #fef3c7;
            color: #92400e;
        }

        select {
            padding: 7px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .logout {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            nav {
                padding: 15px;
            }

            nav h2 {
                font-size: 18px;
            }

            .container {
                margin: 20px auto;
                padding: 10px;
            }

            .box {
                padding: 15px;
            }

            th,
            td {
                padding: 9px;
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <!-- Navigation -->

    <nav>

        <h2>
            👨‍💼 Admin Dashboard
        </h2>

        <div>

            <a href="shop.html">
                Shop
            </a>

            &nbsp;&nbsp;

            <button
                class="logout"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <div class="container">


        <!-- ========================= -->
        <!-- ORDER MANAGEMENT -->
        <!-- ========================= -->

        <h1>
            📊 Order Management
        </h1>


        <!-- Statistics -->

        <div class="stats">

            <div class="stat-card">

                <h3>
                    Total Orders
                </h3>

                <p id="totalOrders">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Pending Orders
                </h3>

                <p id="pendingOrders">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Delivered Orders
                </h3>

                <p id="deliveredOrders">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Total Sales
                </h3>

                <p id="totalSales">
                    0 ETB
                </p>

            </div>

        </div>


        <!-- Customer Orders -->

        <div class="box">

            <h2>
                📦 Customer Orders
            </h2>

            <div id="ordersTable"></div>

        </div>



        <!-- ========================= -->
        <!-- PRODUCT MANAGEMENT -->
        <!-- ========================= -->

        <h1>
            🛍️ Product Management
        </h1>


        <div class="box">

            <h2>
                ➕ Add Product
            </h2>


            <div class="product-form">

                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name">


                <input
                    type="number"
                    id="productPrice"
                    placeholder="Price (ETB)">


                <input
                    type="number"
                    id="productStock"
                    placeholder="Stock">


                <input
                    type="text"
                    id="productImage"
                    placeholder="Image URL">


                <button
                    class="add-btn"
                    onclick="addProduct()">

                    Add Product

                </button>

            </div>


            <div id="productsTable"></div>

        </div>


    </div>



    <script>


        /* =================================
           ORDER MANAGEMENT
        ================================= */


        function loadOrders() {

            let orders =
                JSON.parse(
                    localStorage.getItem("orders")
                ) || [];


            let ordersTable =
                document.getElementById(
                    "ordersTable"
                );


            let pending = 0;
            let delivered = 0;
            let sales = 0;


            if (orders.length === 0) {

                ordersTable.innerHTML = `
                    <div class="empty">
                        📦 No orders found.
                    </div>
                `;

                updateStats(
                    0,
                    0,
                    0,
                    0
                );

                return;
            }


            let html = `

                <table>

                    <thead>

                        <tr>

                            <th>#</th>

                            <th>
                                Customer
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Address
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            orders.forEach(function(order, index) {

                let status =
                    order.status || "Pending";


                if (status === "Pending") {
                    pending++;
                }


                if (status === "Delivered") {
                    delivered++;
                }


                sales += Number(order.total);


                html += `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            <strong>
                                ${order.name}
                            </strong>
                        </td>

                        <td>
                            ${order.phone}
                        </td>

                        <td>
                            ${order.address}
                        </td>

                        <td>
                            ${Number(order.total)
                                .toLocaleString()}
                            ETB
                        </td>

                        <td>
                            ${order.date}
                        </td>

                        <td>

                            <select
                                onchange="
                                updateStatus(
                                    ${index},
                                    this.value
                                )">

                                <option
                                    value="Pending"
                                    ${status === "Pending"
                                        ? "selected"
                                        : ""}>

                                    Pending

                                </option>

                                <option
                                    value="Confirmed"
                                    ${status === "Confirmed"
                                        ? "selected"
                                        : ""}>

                                    Confirmed

                                </option>

                                <option
                                    value="Delivered"
                                    ${status === "Delivered"
                                        ? "selected"
                                        : ""}>

                                    Delivered

                                </option>

                            </select>

                        </td>

                    </tr>

                `;

            });


            html += `

                    </tbody>

                </table>

            `;


            ordersTable.innerHTML = html;


            updateStats(
                orders.length,
                pending,
                delivered,
                sales
            );

        }



        function updateStats(
            total,
            pending,
            delivered,
            sales
        ) {

            document.getElementById(
                "totalOrders"
            ).innerText = total;


            document.getElementById(
                "pendingOrders"
            ).innerText = pending;


            document.getElementById(
                "deliveredOrders"
            ).innerText = delivered;


            document.getElementById(
                "totalSales"
            ).innerText =
                sales.toLocaleString() + " ETB";

        }



        function updateStatus(
            index,
            newStatus
        ) {

            let orders =
                JSON.parse(
                    localStorage.getItem("orders")
                ) || [];


            if (!orders[index]) {
                return;
            }


            orders[index].status =
                newStatus;


            localStorage.setItem(
                "orders",
                JSON.stringify(orders)
            );


            let lastOrder =
                JSON.parse(
                    localStorage.getItem("lastOrder")
                );


            if (
                lastOrder &&
                lastOrder.name === orders[index].name &&
                lastOrder.phone === orders[index].phone
            ) {

                lastOrder.status =
                    newStatus;


                localStorage.setItem(
                    "lastOrder",
                    JSON.stringify(lastOrder)
                );

            }


            loadOrders();

        }



        /* =================================
           PRODUCT MANAGEMENT
        ================================= */


        function loadProducts() {

            let products =
                JSON.parse(
                    localStorage.getItem("products")
                ) || [];


            let productsTable =
                document.getElementById(
                    "productsTable"
                );


            if (products.length === 0) {

                productsTable.innerHTML = `
                    <div class="empty">
                        🛍️ No products found.
                    </div>
                `;

                return;
            }


            let html = `

                <table>

                    <thead>

                        <tr>

                            <th>#</th>

                            <th>
                                Image
                            </th>

                            <th>
                                Product
                            </th>

                            <th>
                                Price
                            </th>

                            <th>
                                Stock
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            products.forEach(function(product, index) {

                html += `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>

                            <img
                                src="${product.image}"
                                class="product-image"
                                alt="${product.name}">

                        </td>

                        <td>
                            <strong>
                                ${product.name}
                            </strong>
                        </td>

                        <td>
                            ${Number(product.price)
                                .toLocaleString()}
                            ETB
                        </td>

                        <td>
                            ${product.stock}
                        </td>

                        <td>

                            <button
                                class="edit-btn"
                                onclick="
                                editProduct(${index})">

                                Edit

                            </button>


                            <button
                                class="delete-btn"
                                onclick="
                                deleteProduct(${index})">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;

            });


            html += `

                    </tbody>

                </table>

            `;


            productsTable.innerHTML = html;

        }



        function addProduct() {

            let name =
                document.getElementById(
                    "productName"
                ).value.trim();


            let price =
                document.getElementById(
                    "productPrice"
                ).value;


            let stock =
                document.getElementById(
                    "productStock"
                ).value;


            let image =
                document.getElementById(
                    "productImage"
                ).value.trim();


            if (
                name === "" ||
                price === "" ||
                stock === "" ||
                image === ""
            ) {

                alert(
                    "Please fill all product fields."
                );

                return;

            }


            let products =
                JSON.parse(
                    localStorage.getItem("products")
                ) || [];


            let newProduct = {

                name: name,

                price: Number(price),

                stock: Number(stock),

                image: image

            };


            products.push(newProduct);


            localStorage.setItem(
                "products",
                JSON.stringify(products)
            );


            document.getElementById(
                "productName"
            ).value = "";


            document.getElementById(
                "productPrice"
            ).value = "";


            document.getElementById(
                "productStock"
            ).value = "";


            document.getElementById(
                "productImage"
            ).value = "";


            loadProducts();


            alert(
                "Product added successfully!"
            );

        }



        function deleteProduct(index) {

            let products =
                JSON.parse(
                    localStorage.getItem("products")
                ) || [];


            if (
                !confirm(
                    "Are you sure you want to delete this product?"
                )
            ) {

                return;

            }


            products.splice(
                index,
                1
            );


            localStorage.setItem(
                "products",
                JSON.stringify(products)
            );


            loadProducts();

        }



        function editProduct(index) {

            let products =
                JSON.parse(
                    localStorage.getItem("products")
                ) || [];


            let product =
                products[index];


            if (!product) {
                return;
            }


            let newName =
                prompt(
                    "Enter product name:",
                    product.name
                );


            if (newName === null) {
                return;
            }


            let newPrice =
                prompt(
                    "Enter product price:",
                    product.price
                );


            if (newPrice === null) {
                return;
            }


            let newStock =
                prompt(
                    "Enter product stock:",
                    product.stock
                );


            if (newStock === null) {
                return;
            }


            let newImage =
                prompt(
                    "Enter product image URL:",
                    product.image
                );


            if (newImage === null) {
                return;
            }


            products[index] = {

                name: newName,

                price: Number(newPrice),

                stock: Number(newStock),

                image: newImage

            };


            localStorage.setItem(
                "products",
                JSON.stringify(products)
            );


            loadProducts();


            alert(
                "Product updated successfully!"
            );

        }



        /* =================================
           LOGOUT
        ================================= */


        function logout() {

            window.location.href =
                "login.html";

        }



        /* =================================
           LOAD DATA
        ================================= */

        loadOrders();

        loadProducts();


    </script>

</body>

</html>
